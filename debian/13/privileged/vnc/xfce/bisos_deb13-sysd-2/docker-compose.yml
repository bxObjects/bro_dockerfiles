services:

  vnc:
    build:
      context: .
      dockerfile: ./Dockerfile

    image: bisos_deb13-sysd:latest
    container_name: bisos_deb13-sysd-2

    privileged: true
    pids_limit: 16384
    cgroup: host

    volumes:
       - ./:/shuttle/this
       - /sys/fs/cgroup:/sys/fs/cgroup:rw
       - /sys/fs/fuse:/sys/fs/fuse
    tmpfs:
      - /tmp
      - /run
      - /run/lock
      - /var/log/journal

    stop_signal: SIGRTMIN+3

    ports:
      - "2227:22"      # SSH
      - "5906:5901"    # VNC
      - "6906:6901"    # NoVNC

# Just run:: docker compose up -d
