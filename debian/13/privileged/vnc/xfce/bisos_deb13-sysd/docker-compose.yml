services:

  vnc:
    build:
      context: .
      dockerfile: ./Dockerfile

    image: bisos/deb13-sysd-vnc-xfce:1
    container_name: mb-deb13-sysd-xfce-1

    privileged: true
    cgroup: host

    volumes:
       - ./:/shuttle/this
       # raw-bisos (fresh-Debian -> Raw-BISOS) SHARED from the confined image,
       # not duplicated. Mounted at the container's ~/raw-bisos.
       - ../../../../confined/vnc/xfce/bisos_deb13-fresh/raw-bisos:/home/bystar/raw-bisos
       - /sys/fs/cgroup:/sys/fs/cgroup:rw
       - /sys/fs/fuse:/sys/fs/fuse
       # /tmp as exec tmpfs to match Debian default (Docker shorthand applies noexec).
       - type: tmpfs
         target: /tmp
         tmpfs:
           mode: 01777

    tmpfs:
      - /run
      - /run/lock
      - /var/log/journal

    stop_signal: SIGRTMIN+3

    ports:
      - "2224:22"      # SSH
      - "5903:5901"    # VNC
      - "6903:6901"    # NoVNC

# Just run:: docker compose up -d
