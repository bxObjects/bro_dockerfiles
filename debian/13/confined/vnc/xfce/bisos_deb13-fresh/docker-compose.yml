services:

  vnc:
    build:
      context: .
      dockerfile: ./Dockerfile

    image: bisos_deb13-fresh:latest
    container_name: bisos_deb13-fresh

    pids_limit: 16384

    volumes:
       - ./:/shuttle/this
       # - /var/bisos/docker/:/shuttle/var

    # restart: no

    ports:
      - "2228:22"    # SSH
      - "5907:5901"    # VNC
      - "6907:6901"    # NoVNC

# Just run:: docker compose up -d
