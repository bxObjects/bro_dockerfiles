services:

  vnc:
    build:
      context: .
      dockerfile: ./Dockerfile

    image: bisos/deb12-sysd-vnc-xfce:1
    container_name: mb-deb12-sysd-xfce-1

    privileged: true
    cgroup: host

    volumes:
       - ./:/shuttle/this
       # raw-bisos (fresh-Debian -> Raw-BISOS) SHARED from the confined image,
       # not duplicated. Mounted at the container's ~/raw-bisos.
       - ../../../../confined/vnc/xfce/bisos_deb12-fresh/raw-bisos:/home/bystar/raw-bisos
       - /sys/fs/cgroup:/sys/fs/cgroup:rw
       - /sys/fs/fuse:/sys/fs/fuse
    tmpfs:
      - /tmp
      - /run
      - /run/lock
      - /var/log/journal

    stop_signal: SIGRTMIN+3

    ports:
      - "2223:22"      # SSH
      - "5902:5901"    # VNC
      - "6902:6901"    # NoVNC

# Just run:: docker compose up -d
